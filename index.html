<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Estudos | UEG</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- GridStack CSS -->
<link href="https://cdn.jsdelivr.net/npm/gridstack@9.2.0/dist/gridstack.min.css" rel="stylesheet"/>
<style>
:root{--surface:rgba(255,255,255,.35);--text:#0f172a;--muted:#334155;--border:rgba(255,255,255,.55);--accent:#15803d;--danger:#dc2626;--shadow:0 8px 32px rgba(0,0,0,.12);--text-shadow:0 1px 2px rgba(255,255,255,.8)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif}
html{scroll-behavior:smooth}
body{min-height:100vh;padding:20px;color:var(--text);background:url('https://images8.alphacoders.com/896/thumb-1920-896653.jpg') center/cover fixed no-repeat}
body.app-active{background-image:url('https://images8.alphacoders.com/896/thumb-1920-896653.jpg')}
button,input,select,textarea{font:inherit}.hidden{display:none!important}
.app{width:100%;max-width:1400px;margin:0 auto;display:none;flex-direction:column;gap:20px}

.glass{background:rgba(255,255,255,.35)!important;backdrop-filter:blur(16px)!important;-webkit-backdrop-filter:blur(16px)!important;border:1px solid var(--border)!important;border-radius:16px;box-shadow:var(--shadow);will-change:transform}

.login{max-width:390px;margin:12vh auto;padding:34px 26px;background:rgba(255,255,255,.55)!important;backdrop-filter:blur(14px)!important;border:1px solid var(--border);border-radius:20px;display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:var(--shadow)}
.login h2{font-size:1.3rem;text-shadow:var(--text-shadow)}
.login input,.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(15,23,42,.22);background:rgba(255,255,255,.55);outline:none;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.btn{border:0;border-radius:99px;padding:9px 14px;background:#000;color:#fff;font-size:.75rem;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.btn:hover{opacity:.88}.btn-sec{background:rgba(255,255,255,.4);color:#000;border:1px solid rgba(15,23,42,.28)}.btn-green{background:var(--accent)}.btn-red{background:var(--danger)}.btn-orange{background:#d97706}

header{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.brand h1{font-size:1.2rem;text-shadow:var(--text-shadow)}.brand p{font-size:.75rem;color:var(--muted);font-weight:700}
.clock{text-align:right}.clock strong{font-size:1.1rem;text-shadow:var(--text-shadow)}.clock span{display:block;font-size:.72rem;font-weight:700;text-transform:capitalize;color:var(--muted)}

.toolbar{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ai-bar{display:flex;gap:8px;flex:1;min-width:300px}.ai-bar input{flex:1;padding:9px 16px;border-radius:99px;border:1px solid rgba(15,23,42,.22);background:rgba(255,255,255,.65);font-size:.8rem;outline:none}
.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.grid-stack-item-content{padding:18px;overflow:auto!important}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.title{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;text-shadow:var(--text-shadow)}
.subtle{font-size:.72rem;color:var(--muted);font-weight:700}

.drag-handle{display:none;cursor:grab;font-size:1rem;opacity:.8;margin-right:6px;padding:2px 6px;background:rgba(0,0,0,.08);border-radius:6px}
body.edit-mode .drag-handle{display:inline-block}
body.edit-mode .grid-stack-item-content{border:2px dashed var(--accent)!important}

.subjects{display:grid;grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));gap:10px}
.subject-card{padding:12px;border-radius:12px;background:rgba(255,255,255,.35);border:1px solid var(--border);border-left:5px solid var(--accent);box-shadow:var(--shadow);cursor:pointer}
.subject-top{display:flex;justify-content:space-between;gap:8px}.subject-name{font-size:.82rem;font-weight:800;line-height:1.22}.teacher{font-size:.68rem;color:#334155;font-weight:700;margin-top:2px}
.subject-time{font-size:.7rem;font-weight:800;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.chip{padding:2px 6px;border-radius:999px;font-size:.58rem;font-weight:800;background:#fee2e2;color:#991b1b}
.subject-actions{display:flex;gap:6px;margin-top:8px}
.mini-btn{border:1px solid rgba(0,0,0,.2);background:rgba(255,255,255,.6);color:#334155;border-radius:6px;padding:4px 7px;font-size:.6rem;font-weight:800;cursor:pointer}
.mini-btn:hover{background:#000;color:#fff}
.mini-btn.red:hover{background:var(--danger);color:#fff}

.schedule{display:grid;grid-template-columns:repeat(5, 1fr);gap:10px}
.day{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.25);border:1px solid var(--border);min-height:95px}
.day.is-today{background:rgba(255,255,255,.55);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day h4{font-size:.68rem;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.day h4 .today-tag{font-size:.55rem;padding:2px 6px;border-radius:99px;background:var(--accent);color:#fff;font-weight:800}

.class-mini{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.08);margin-top:6px;border-left:4px solid var(--accent);display:flex;flex-direction:column;gap:4px}
.class-mini-top{display:flex;justify-content:space-between;align-items:flex-start}
.class-mini strong{font-size:.7rem;line-height:1.2}.class-mini span{font-size:.62rem;color:#334155;font-weight:700}
.class-mini-actions{display:flex;gap:4px;margin-top:2px}

.item{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.35);border:1px solid rgba(0,0,0,.12);margin-top:8px}
.item-head{display:flex;justify-content:space-between;gap:7px}.item-title{font-size:.75rem;font-weight:800}.meta{font-size:.65rem;color:#475569;font-weight:700;margin-top:2px}
.exam-countdown{margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.4);border:1px solid rgba(220,38,38,.25);display:flex;justify-content:space-between;align-items:center}
.badge{padding:3px 8px;border-radius:999px;font-size:.6rem;font-weight:800}.badge.red{background:#fee2e2;color:#991b1b}
.empty{padding:12px;text-align:center;color:#475569;font-size:.72rem;font-weight:700}

.pomodoro-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.pomodoro-mode{padding:8px;border-radius:10px;border:2px solid rgba(0,0,0,.14);background:rgba(255,255,255,.4);font-size:.65rem;font-weight:800;cursor:pointer;text-align:center}
.pomodoro-mode.active{border-color:var(--accent);background:rgba(255,255,255,.7)}
.timer-wrap{position:relative;padding:14px;border-radius:14px;background:rgba(255,255,255,.4);border:2px solid transparent;text-align:center}
.timer-wrap.mode-focus{border-color:rgba(21,128,61,.35)}.timer{font-size:2.5rem;font-weight:800;line-height:1}
.timer-label{font-size:.68rem;font-weight:800;text-transform:uppercase;color:var(--muted)}
.pomodoro-actions{display:flex;gap:6px;justify-content:center;margin-top:10px}

.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-head{padding:4px;text-align:center;font-size:.6rem;font-weight:800;background:rgba(255,255,255,.3);border-radius:4px}
.cal-cell{min-height:30px;padding:3px;border-radius:6px;background:rgba(255,255,255,.2);border:1px solid rgba(0,0,0,.05);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cal-cell.today{outline:2px solid var(--accent);background:rgba(255,255,255,.6)}
.cal-day{font-size:.68rem;font-weight:800}.cal-event.exam{width:5px;height:5px;border-radius:999px;margin-top:2px;background:var(--danger)}

.back-to-top{position:fixed;bottom:24px;right:24px;width:48px;height:48px;border-radius:99px;background:rgba(255,255,255,.35)!important;backdrop-filter:blur(16px)!important;-webkit-backdrop-filter:blur(16px)!important;color:var(--text);border:1px solid var(--border)!important;font-size:1.3rem;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);opacity:0;visibility:hidden;z-index:9999}
.back-to-top.show{opacity:1;visibility:visible}
.back-to-top:hover{background:rgba(255,255,255,.6)!important}

.modal-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10000;padding:18px;align-items:center;justify-content:center}
.modal{max-width:820px;width:100%;max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}
.close{background:var(--danger);color:#fff;border:0;border-radius:7px;padding:6px 10px;font-weight:800;cursor:pointer}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:.65rem;font-weight:800;text-transform:uppercase}.field.full{grid-column:1/-1}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;right:20px;bottom:20px;display:none;background:#000;color:#fff;padding:10px 16px;border-radius:10px;font-size:.75rem;font-weight:800;z-index:11001}

@media(max-width:900px){.schedule{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="loginScreen" class="login">
  <h2>🔒 Central de Estudos</h2>
  <p>Digite a senha de acesso para liberar seu painel.</p>
  <input id="passInput" type="password" placeholder="Digite a senha..." onkeydown="if(event.key==='Enter')checkPassword()">
  <button class="btn" onclick="checkPassword()">Acessar Painel</button>
</div>

<div id="app" class="app">
  <header class="glass">
    <div class="brand"><div>📚</div><div><h1>Central de Estudos</h1><p>Todas as matérias da faculdade em uma única tela</p></div></div>
    <div class="clock"><strong id="digitalClock">00:00:00</strong><span id="currentDate"></span></div>
  </header>

  <div class="glass toolbar">
    <div class="ai-bar">
      <input id="aiInput" type="text" placeholder="⚡ Comando rápido (Ex: iniciar timer, apagar provas, apagar horarios)..." onkeydown="if(event.key==='Enter')runAICommand()">
      <button class="btn btn-green" onclick="runAICommand()" id="aiBtn">Executar Comando</button>
    </div>
    <div class="toolbar-right">
      <button class="btn btn-orange" id="editLayoutBtn" onclick="toggleEditMode()">🔓 Mover & Redimensionar</button>
      <button class="btn btn-green" onclick="openClassModal()">＋ Aula</button>
      <button class="btn btn-red" onclick="openAssessmentModal()">＋ Prova</button>
      <button class="btn btn-sec" onclick="openSubjectModal()">＋ Disciplina</button>
      <button class="btn btn-sec" onclick="refreshAll()">↻ Atualizar</button>
    </div>
  </div>

  <div class="grid-stack">
    
    <!-- CRONÔMETRO -->
    <div class="grid-stack-item" gs-w="4" gs-h="4" gs-id="box-pomodoro">
      <div class="grid-stack-item-content glass">
        <div class="section-head">
          <div><span class="drag-handle">⠿</span><span class="title">🍅 Cronômetro</span></div>
          <select id="studySubject" style="max-width:110px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,.22);background:rgba(255,255,255,.55);font-size:.65rem;font-weight:700"><option value="">Disciplina</option></select>
        </div>
        <div class="pomodoro-wrap">
          <div class="pomodoro-modes" id="pomodoroModes">
            <button type="button" class="pomodoro-mode active" data-mode="focus" onclick="setPomodoroMode('focus')">🎯 Foco<span style="display:block;font-size:.55rem">25m</span></button>
            <button type="button" class="pomodoro-mode" data-mode="short" onclick="setPomodoroMode('short')">☕ Pausa<span style="display:block;font-size:.55rem">5m</span></button>
            <button type="button" class="pomodoro-mode" data-mode="long" onclick="setPomodoroMode('long')">🌿 Longa<span style="display:block;font-size:.55rem">15m</span></button>
          </div>
          <div class="timer-wrap mode-focus" id="timerWrap">
            <div class="timer-label focus" id="timerLabel">Tempo de foco</div>
            <div class="timer" id="timer">25:00</div>
            <div id="pomodoroStatus" style="font-size:.65rem;font-weight:700;margin-top:2px">Pronto para iniciar</div>
          </div>
          <div class="pomodoro-actions">
            <button class="btn btn-green" id="startBtn" onclick="toggleTimer()">Iniciar</button>
            <button class="btn btn-sec" id="pauseBtn" onclick="pauseTimer()" disabled>Pausar</button>
            <button class="btn btn-sec" onclick="resetTimer()">Reiniciar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- CALENDÁRIO -->
    <div class="grid-stack-item" gs-w="4" gs-h="4" gs-id="box-calendario">
      <div class="grid-stack-item-content glass">
        <div class="section-head">
          <div><span class="drag-handle">⠿</span><span class="title">🗓️ Calendário</span></div>
          <span id="calendarMonth" class="subtle"></span>
        </div>
        <div id="calendar" class="calendar"></div>
      </div>
    </div>

    <!-- DISCIPLINAS -->
    <div class="grid-stack-item" gs-w="4" gs-h="4" gs-id="box-disciplinas">
      <div class="grid-stack-item-content glass">
        <div class="section-head">
          <div><span class="drag-handle">⠿</span><span class="title">📚 Disciplinas</span></div>
          <button class="btn btn-sec" onclick="openSubjectModal()">＋ Nova</button>
        </div>
        <div id="subjectsGrid" class="subjects"></div>
      </div>
    </div>

    <!-- HORÁRIOS DA SEMANA -->
    <div class="grid-stack-item" gs-w="12" gs-h="3" gs-id="box-horarios">
      <div class="grid-stack-item-content glass">
        <div class="section-head">
          <div><span class="drag-handle">⠿</span><span class="title">🕐 Horários da semana</span></div>
          <button class="btn btn-sec" onclick="openClassModal()">＋ Horário</button>
        </div>
        <div id="schedule" class="schedule"></div>
      </div>
    </div>

    <!-- PRÓXIMAS PROVAS -->
    <div class="grid-stack-item" gs-w="12" gs-h="3" gs-id="box-provas">
      <div class="grid-stack-item-content glass">
        <div class="section-head">
          <div><span class="drag-handle">⠿</span><span class="title">🔴 Próximas provas</span></div>
          <button class="btn btn-red" onclick="openAssessmentModal()">＋ Prova</button>
        </div>
        <div id="assessmentsList"></div>
      </div>
    </div>

  </div>
</div>

<button class="back-to-top" id="backToTopBtn" onclick="scrollToTop()" title="Voltar ao topo">↑</button>

<div id="modalWrap" class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Detalhes</h3><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/gridstack@9.2.0/dist/gridstack-all.js"></script>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import {getFirestore,collection,addDoc,onSnapshot,deleteDoc,doc,updateDoc,enableIndexedDbPersistence,query,orderBy,limit,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

const firebaseConfig={apiKey:'AIzaSyC09EhGx9GSo4IUjxWXJxqksnKgOU4khQ',authDomain:'painel-estudos-54958.firebaseapp.com',projectId:'painel-estudos-54958',storageBucket:'painel-estudos-54958.firebasestorage.app',messagingSenderId:'491796500394',appId:'1:491796500394:web:f6d85850484df33b8de5d3'};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
let realtimeUnsubs=[], isEditMode=false, grid=null;
const data={subjects:[],classes:[],assessments:[]};
const SITE_PASSWORD='ueg2026';
const POMODORO={focus:25,short:5,long:15};
const POMODORO_LABELS={focus:'Tempo de foco',short:'Pausa curta',long:'Pausa longa'};

let timerId=null, timerEndTime=null, timerMinutes=25, timeLeft=1500, pomodoroMode='focus', timerRunning=false, timerPaused=false;
const $=id=>document.getElementById(id),col=name=>collection(db,name);

window.escapeHtml=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
window.showToast=msg=>{const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.toastId);window.toastId=setTimeout(()=>t.style.display='none',2200)};

window.showApp = function() {
  const login = $('loginScreen'), appEl = $('app');
  if (login) login.classList.add('hidden');
  if (appEl) appEl.style.display = 'flex';
  document.body.classList.add('app-active');
  initGridStack();
};

window.checkPassword = function() {
  const input = $('passInput');
  if (input && input.value === SITE_PASSWORD) {
    localStorage.setItem('ueg_access_granted', 'true');
    window.showApp();
  } else {
    alert('Senha incorreta!');
  }
};

async function initPersistence(){
  try{ await enableIndexedDbPersistence(db); }catch(err){}
}

function subscribeRealtime(name,key,{sort=null,sortDir='asc',limitTo=null,reverse=false,onData}){
  const constraints=[];
  if(sort)constraints.push(orderBy(sort,sortDir));
  if(limitTo)constraints.push(limit(limitTo));
  const q=constraints.length?query(col(name),...constraints):col(name);
  const unsub=onSnapshot(q,snapshot=>{
    let items=snapshot.docs.map(d=>({id:d.id,...d.data()}));
    if(reverse)items=items.reverse();
    data[key]=items;
    onData?.(data[key]);
  }, err => showToast(`Erro ao carregar ${name}`));
  realtimeUnsubs.push(unsub);
}

function bindRealtimeListeners(){
  subscribeRealtime('subjects','subjects',{sort:'name',onData:()=>{renderSubjects();renderSchedule();renderStudySubjects()}});
  subscribeRealtime('classes','classes',{sort:'day',onData:()=>{renderSubjects();renderSchedule()}});
  subscribeRealtime('assessments','assessments',{sort:'date',onData:()=>{renderAssessments();renderCalendar()}});
}

async function writeDoc(name,id,payload){
  try {
    const body={...payload,updatedAt:serverTimestamp(),clientTs:Date.now()};
    if(id)await updateDoc(doc(db,name,id),body);
    else await addDoc(col(name),{...body,createdAt:serverTimestamp()});
  } catch(e) { showToast("Erro ao salvar alterações"); }
}

window.closeModal=()=>{$('modalWrap').style.display='none'};window.openModal=(title,body)=>{$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalWrap').style.display='flex'};
const modalActions=()=>`<div class="modal-actions"><button type="button" class="btn btn-sec" onclick="closeModal()">Cancelar</button><button class="btn btn-green" type="submit">Salvar</button></div>`;
async function saveDoc(name,id,payload){await writeDoc(name,id,payload);showToast('Salvo com sucesso');closeModal()}
window.removeDoc=async(name,id)=>{if(confirm('Excluir este item?')){try{await deleteDoc(doc(db,name,id));showToast('Item excluído')}catch(e){showToast('Erro ao excluir')}}};

/* MODAL DE DISCIPLINAS */
window.openSubjectModal=async id=>{
  const x=id?data.subjects.find(v=>v.id===id):{};
  openModal(id?'Editar disciplina':'Nova disciplina',`<form onsubmit="saveSubject(event,'${id||''}')"><div class="form-grid"><div class="field full"><label>Nome da disciplina</label><input name="name" required value="${escapeHtml(x.name||'')}"></div><div class="field"><label>Professor</label><input name="teacher" value="${escapeHtml(x.teacher||'')}"></div><div class="field"><label>Cor</label><input name="color" type="color" value="${x.color||'#15803d'}"></div><div class="field full"><label>Observações</label><textarea name="notes">${escapeHtml(x.notes||'')}</textarea></div></div>${modalActions()}</form>`);
};
window.saveSubject=async(e,id)=>{
  e.preventDefault();
  const f=new FormData(e.target);
  await saveDoc('subjects',id,{name:f.get('name').trim(),teacher:f.get('teacher').trim(),color:f.get('color'),notes:f.get('notes').trim()});
};

/* MODAL DE HORÁRIOS / AULAS COM SINCRONIZAÇÃO TOTAL */
window.openClassModal=async id=>{
  const x=id?data.classes.find(v=>v.id===id):{};
  if (!data.subjects.length) {
    alert("Cadastre pelo menos uma disciplina antes de adicionar um horário.");
    return openSubjectModal();
  }
  
  openModal(id?'Editar horário de aula':'Novo horário de aula',`
    <form onsubmit="saveClass(event,'${id||''}')">
      <div class="form-grid">
        <div class="field full">
          <label>Disciplina</label>
          <select name="subjectId" required>
            ${data.subjects.map(s=>`<option value="${s.id}" ${(x.subjectId===s.id)?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Dia da Semana (Posição)</label>
          <select name="day">
            <option value="1" ${x.day===1?'selected':''}>Segunda-feira</option>
            <option value="2" ${x.day===2?'selected':''}>Terça-feira</option>
            <option value="3" ${x.day===3?'selected':''}>Quarta-feira</option>
            <option value="4" ${x.day===4?'selected':''}>Quinta-feira</option>
            <option value="5" ${x.day===5?'selected':''}>Sexta-feira</option>
          </select>
        </div>
        <div class="field">
          <label>Sala / Bloco</label>
          <input name="room" placeholder="Ex: Sala 204" value="${escapeHtml(x.room||'')}">
        </div>
        <div class="field">
          <label>Horário Início</label>
          <input name="start" type="time" required value="${x.start||''}">
        </div>
        <div class="field">
          <label>Horário Fim</label>
          <input name="end" type="time" required value="${x.end||''}">
        </div>
      </div>
      ${modalActions()}
    </form>
  `);
};

window.saveClass=async(e,id)=>{
  e.preventDefault();
  const f=new FormData(e.target), s=data.subjects.find(v=>v.id===f.get('subjectId'));
  await saveDoc('classes',id,{
    subjectId:f.get('subjectId'),
    title:s?.name||'',
    day:Number(f.get('day')),
    start:f.get('start'),
    end:f.get('end'),
    teacher:s?.teacher||'',
    room:f.get('room').trim()
  });
};

/* MODAL DE PROVAS */
window.openAssessmentModal=async id=>{
  const x=id?data.assessments.find(v=>v.id===id):{};
  openModal(id?'Editar prova':'Nova prova',`<form onsubmit="saveAssessment(event,'${id||''}')"><div class="form-grid"><div class="field full"><label>Prova / avaliação</label><input name="title" required value="${escapeHtml(x.title||'')}"></div><div class="field"><label>Disciplina</label><select name="subjectId" required>${data.subjects.map(s=>`<option value="${s.id}" ${x.subjectId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input name="date" type="date" required value="${x.date||''}"></div><div class="field"><label>Data final (opcional)</label><input name="endDate" type="date" value="${x.endDate||''}"></div><div class="field"><label>Horário</label><input name="time" type="time" value="${x.time||''}"></div><div class="field"><label>Local</label><input name="location" value="${escapeHtml(x.location||'')}"></div><div class="field full"><label>Conteúdo</label><textarea name="content">${escapeHtml(x.content||'')}</textarea></div></div>${modalActions()}</form>`);
};
window.saveAssessment=async(e,id)=>{
  e.preventDefault();
  const f=new FormData(e.target);
  await saveDoc('assessments',id,{title:f.get('title').trim(),subjectId:f.get('subjectId'),date:f.get('date'),endDate:f.get('endDate'),time:f.get('time'),location:f.get('location').trim(),content:f.get('content').trim()});
};

window.openSubjectDetails=id=>{
  const s=data.subjects.find(x=>x.id===id);
  if(!s)return;
  const cls=data.classes.filter(x=>x.subjectId===id),tests=data.assessments.filter(x=>x.subjectId===id);
  openModal(s.name,`<div class="detail-list"><div class="detail"><b>👩‍🏫 Professor</b><p>${escapeHtml(s.teacher||'Não informado')}</p></div><div class="detail"><b>🕐 Horários</b><p>${cls.length?cls.map(x=>`${dayName(x.day)} • ${x.start}–${x.end}${x.room?' • Sala '+escapeHtml(x.room):''}`).join('<br>'):'Nenhum horário cadastrado'}</p></div><div class="detail"><b>🔴 Provas</b><p>${tests.length?tests.map(x=>`${formatDate(x.date)}${x.time?' • '+x.time:''} — ${escapeHtml(x.title)}`).join('<br>'):'Nenhuma prova cadastrada'}</p></div>${s.notes?`<div class="detail"><b>📝 Observações</b><p>${escapeHtml(s.notes)}</p></div>`:''}<div class="modal-actions"><button class="btn btn-sec" onclick="openSubjectModal('${id}')">Editar disciplina</button><button class="btn btn-red" onclick="removeDoc('subjects','${id}');closeModal()">Excluir disciplina</button></div></div>`);
};

function dayName(n){return ['','Segunda','Terça','Quarta','Quinta','Sexta'][n]||''}
function formatDate(s){if(!s)return 'Sem data';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function daysUntil(date){const a=new Date();a.setHours(0,0,0,0);const b=new Date(date+'T00:00:00');return Math.ceil((b-a)/86400000)}

function renderAll(){renderSubjects();renderSchedule();renderAssessments();renderCalendar();renderStudySubjects()}

function renderSubjects(){
  $('subjectsGrid').innerHTML=data.subjects.length?data.subjects.map(s=>{
    const cls=data.classes.filter(x=>x.subjectId===s.id).sort((a,b)=>a.start.localeCompare(b.start)),tests=data.assessments.filter(x=>x.subjectId===s.id).sort((a,b)=>a.date.localeCompare(b.date));
    const next=tests[0];
    const grouped={};cls.forEach(c=>(grouped[c.day]??=[]).push(c));
    const timeLabel=Object.entries(grouped).map(([d,blocks])=>`${dayName(d)} ${blocks.map(c=>`${c.start}–${c.end}`).join(' / ')}`).join(' • ');
    return `<div class="subject-card" data-id="${s.id}" style="border-left-color:${s.color||'var(--accent)'}" onclick="openSubjectDetails('${s.id}')"><div class="subject-top"><div><div class="subject-name">${escapeHtml(s.name)}</div><div class="teacher">${escapeHtml(s.teacher||'Professor não informado')}</div></div><div class="subtle">↗</div></div><div class="subject-time">${cls.length?timeLabel:'Sem horário'}</div><div class="chips">${next?`<span class="chip">Prova ${formatDate(next.date)}</span>`:''}</div><div class="subject-actions" onclick="event.stopPropagation()"><button class="mini-btn" onclick="openClassModalFor('${s.id}')">＋ Horário</button><button class="mini-btn" onclick="openSubjectModal('${s.id}')">Editar</button></div></div>`
  }).join(''):'<div class="empty">Nenhuma disciplina cadastrada.</div>';
}

window.openClassModalFor=id=>{openClassModal();setTimeout(()=>{const q=document.querySelector('[name="subjectId"]');if(q)q.value=id},0)}

/* RENDERIZAÇÃO DOS HORÁRIOS COM BOTÕES DE EDIÇÃO E EXCLUSÃO INTEGARDOS */
function renderSchedule(){
  const todayNum = new Date().getDay();
  const daysHtml = [1, 2, 3, 4, 5].map(n => {
    const isToday = todayNum === n;
    const classes = data.classes.filter(c => Number(c.day) === n).sort((a,b) => a.start.localeCompare(b.start));
    
    return `<div class="day ${isToday ? 'is-today' : ''}">
      <h4>${dayName(n)} ${isToday ? '<span class="today-tag">Hoje</span>' : ''}</h4>
      ${classes.map(c => {
        const sub = data.subjects.find(s => s.id === c.subjectId);
        const name = sub ? sub.name : (c.title || 'Disciplina');
        const color = sub ? sub.color : 'var(--accent)';
        
        return `<div class="class-mini" style="border-left-color:${color}">
          <div class="class-mini-top">
            <strong>${escapeHtml(name)}</strong>
          </div>
          <span>${c.start}–${c.end}${c.room ? ' • '+escapeHtml(c.room) : ''}</span>
          <div class="class-mini-actions">
            <button class="mini-btn" onclick="openClassModal('${c.id}')" title="Mover dia ou editar">✏️ Editar</button>
            <button class="mini-btn red" onclick="removeDoc('classes','${c.id}')" title="Apagar horário">🗑️</button>
          </div>
        </div>`;
      }).join('') || '<div class="empty" style="padding:8px 0">Sem aula</div>'}
    </div>`;
  });
  $('schedule').innerHTML = daysHtml.join('');
}

function assessmentBlock(x){
  const s=data.subjects.find(v=>v.id===x.subjectId);
  const d=daysUntil(x.date);
  const state=d<0?'Realizada':d===0?'É hoje!':d===1?'Amanhã':`Faltam ${d} dias`;
  return `<div class="item"><div class="item-head"><div class="item-title">${escapeHtml(x.title)}</div><span class="badge red">${d<0?'Realizada':d===0?'Hoje':d===1?'Amanhã':d+' dias'}</span></div><div class="meta">${escapeHtml(s?.name||'Geral')} • ${formatDate(x.date)}${x.time?' • '+x.time:''}</div><div class="exam-countdown"><strong>${state}</strong></div><div class="subject-actions"><button class="mini-btn" onclick="openAssessmentModal('${x.id}')">Editar</button><button class="mini-btn" onclick="removeDoc('assessments','${x.id}')">Excluir</button></div></div>`;
}

function renderAssessments(){
  const arr=data.assessments.filter(x=>daysUntil(x.date)>=-1).sort((a,b)=>a.date.localeCompare(b.date));
  $('assessmentsList').innerHTML=arr.length?arr.map(x=>assessmentBlock(x)).join(''):'<div class="empty">Nenhuma prova cadastrada.</div>';
}

function renderStudySubjects(){
  $('studySubject').innerHTML='<option value="">Disciplina</option>'+data.subjects.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
}

function renderCalendar(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  const first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate();
  $('calendarMonth').textContent=n.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const heads=['S','T','Q','Q','S','S','D'];
  let h=heads.map(x=>`<div class="cal-head">${x}</div>`).join('');
  for(let i=0;i<start;i++)h+='<div class="cal-cell"></div>';
  for(let d=1;d<=last;d++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=d===n.getDate();
    const ev=data.assessments.filter(x=>x.date===iso);
    h+=`<div class="cal-cell ${isToday?'today':''}"><div class="cal-day">${d}</div>${ev.length?`<div class="cal-event exam"></div>`:''}</div>`;
  }
  $('calendar').innerHTML=h;
}

// POMODORO
function updatePomodoroUI(){
  const wrap=$('timerWrap'),label=$('timerLabel'),status=$('pomodoroStatus');
  wrap.className='timer-wrap mode-'+pomodoroMode+(timerRunning?' running':'');
  label.className='timer-label '+pomodoroMode;
  label.textContent=POMODORO_LABELS[pomodoroMode];
  document.querySelectorAll('.pomodoro-mode').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===pomodoroMode));
  status.textContent=timerRunning?'Em andamento...':timerPaused?'Pausado':'Pronto para iniciar';
  $('startBtn').textContent=timerRunning?'Em curso':timerPaused?'Continuar':'Iniciar';
  $('startBtn').disabled=timerRunning;
  $('pauseBtn').disabled=!timerRunning;
}

function updateDisplay(){ $('timer').textContent=`${String(Math.floor(timeLeft/60)).padStart(2,'0')}:${String(timeLeft%60).padStart(2,'0')}`; }
function stopTimerInterval(){if(timerId){clearInterval(timerId);timerId=null}timerRunning=false;updatePomodoroUI()}
function finishPomodoro(){ stopTimerInterval();timerPaused=false;showToast("Sessão finalizada!");timeLeft=timerMinutes*60;updateDisplay();updatePomodoroUI(); }

window.toggleTimer=()=>{
  if(timerRunning)return;
  timerRunning=true;timerPaused=false;$('startBtn').disabled=true;updatePomodoroUI();
  timerEndTime = Date.now() + (timeLeft * 1000);
  timerId=setInterval(()=>{
    const now = Date.now();
    timeLeft = Math.max(0, Math.round((timerEndTime - now) / 1000));
    updateDisplay();
    if(timeLeft <= 0) finishPomodoro();
  },200);
};

window.pauseTimer=()=>{if(!timerRunning)return;stopTimerInterval();timerPaused=true;updatePomodoroUI();$('startBtn').disabled=false};
window.resetTimer=()=>{stopTimerInterval();timerPaused=false;timeLeft=timerMinutes*60;updateDisplay();$('startBtn').disabled=false;};
window.setPomodoroMode=mode=>{
  if(!POMODORO[mode])return;
  if(timerRunning||timerPaused){if(!confirm('Trocar o modo vai reiniciar o cronômetro. Continuar?'))return;resetTimer()}
  pomodoroMode=mode;timerMinutes=POMODORO[mode];timeLeft=timerMinutes*60;updateDisplay();updatePomodoroUI();
};

updateDisplay();updatePomodoroUI();
function updateClock(){const n=new Date();$('digitalClock').textContent=n.toLocaleTimeString('pt-BR');$('currentDate').textContent=n.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})};setInterval(updateClock,1000);updateClock();

function initGridStack() {
  grid = GridStack.init({
    cellHeight: 85,
    margin: 10,
    disableResize: true,
    disableDrag: true,
    handle: '.drag-handle'
  });

  const savedLayout = localStorage.getItem('user_grid_layout_v2');
  if (savedLayout) {
    try {
      const layout = JSON.parse(savedLayout);
      grid.load(layout);
    } catch(e){}
  }

  grid.on('change', function() {
    const layout = grid.save(false);
    localStorage.setItem('user_grid_layout_v2', JSON.stringify(layout));
  });
}

window.toggleEditMode = function() {
  isEditMode = !isEditMode;
  const btn = $('editLayoutBtn');
  if (isEditMode) {
    document.body.classList.add('edit-mode');
    btn.textContent = '🔒 Travar Layout';
    btn.classList.replace('btn-orange', 'btn-green');
    grid.enable();
    showToast('Modo de edição ativo! Arraste pelas bordas ou alças.');
  } else {
    document.body.classList.remove('edit-mode');
    btn.textContent = '🔓 Mover & Redimensionar';
    btn.classList.replace('btn-green', 'btn-orange');
    grid.disable();
    showToast('Layout salvo!');
  }
};

window.scrollToTop = function() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.addEventListener('scroll', () => {
  const btn = $('backToTopBtn');
  if (btn) {
    if (window.scrollY > 150) btn.classList.add('show');
    else btn.classList.remove('show');
  }
});

async function loadAll(){
  await initPersistence();
  bindRealtimeListeners();
}
window.refreshAll=()=>{renderAll();showToast('Painel atualizado')};

window.runAICommand = async () => {
  const input = $('aiInput');
  const rawText = input.value.trim();
  if (!rawText) return;

  const textClean = rawText.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  if (textClean.includes('iniciar') || textClean.includes('start') || textClean.includes('play')) {
    window.toggleTimer();
    showToast("✨ Cronômetro rodando!");
    input.value = "";
    return;
  }
  if (textClean.includes('pausar') || textClean.includes('pausa') || textClean.includes('parar')) {
    window.pauseTimer();
    showToast("✨ Cronômetro pausado!");
    input.value = "";
    return;
  }
  if (textClean.includes('reiniciar') || textClean.includes('resetar')) {
    window.resetTimer();
    showToast("✨ Cronômetro reiniciado!");
    input.value = "";
    return;
  }

  const isDelete = textClean.includes('apagar') || textClean.includes('excluir') || textClean.includes('limpar') || textClean.includes('deletar');
  
  if (isDelete && textClean.includes('prova')) {
    if (confirm("Quer mesmo apagar TODAS as provas?")) {
      for (const item of data.assessments) await deleteDoc(doc(db, 'assessments', item.id));
      showToast("✨ Todas as provas foram apagadas!");
    }
    input.value = "";
    return;
  }

  if (isDelete && (textClean.includes('materia') || textClean.includes('disciplina'))) {
    if (confirm("Quer mesmo apagar TODAS as disciplinas?")) {
      for (const item of data.subjects) await deleteDoc(doc(db, 'subjects', item.id));
      showToast("✨ Todas as disciplinas foram apagadas!");
    }
    input.value = "";
    return;
  }

  if (isDelete && textClean.includes('horario')) {
    if (confirm("Quer mesmo apagar TODOS os horários da semana?")) {
      for (const item of data.classes) await deleteDoc(doc(db, 'classes', item.id));
      showToast("✨ Todos os horários foram apagados!");
    }
    input.value = "";
    return;
  }

  if (textClean.includes('adicionar materia') || textClean.includes('adicionar disciplina') || textClean.includes('criar materia') || textClean.includes('criar disciplina')) {
    const name = rawText.replace(/(adicionar|adicione|criar|cria|materia|disciplina)/gi, '').trim();
    if (name) {
      await writeDoc('subjects', null, { name, teacher: "", color: "#15803d" });
      showToast(`✨ Disciplina "${name}" criada!`);
    }
    input.value = "";
    return;
  }

  showToast("Comando não reconhecido. Use: 'iniciar timer', 'apagar provas', 'apagar horarios'.");
  input.value = "";
};

window.addEventListener('load',()=>{
  if(localStorage.getItem('ueg_access_granted')==='true')window.showApp();
  loadAll();
});
</script>
