<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Aluno UEG - V9 Pro</title>

    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Chart.js & FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/pt-br.global.min.js"></script>

    <!-- Firebase App & Firestore -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* ==========================================================================
           1. VARIÁVEIS E TEMA BASE (DESIGN SYSTEM V9)
           ========================================================================== */
        :root {
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --bg-page: #0B0F17;
            --bg-card: rgba(22, 27, 38, 0.7);
            --bg-card-hover: rgba(30, 37, 52, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            
            --primary: #3B82F6;
            --primary-hover: #2563EB;
            --primary-glow: rgba(59, 130, 246, 0.25);
            
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            
            --sidebar-width: 260px;
            --header-height: 70px;
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-page: #F8FAFC;
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-card-hover: #FFFFFF;
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #0F172A;
            --text-muted: #64748B;
        }

        /* RESET & BASE */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* AUTH OVERLAY */
        #auth-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg-page);
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            background: var(--bg-card);
            padding: 2.5rem; border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            width: 100%; max-width: 400px; text-align: center;
        }

        /* LAYOUT PRINCIPAL */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
            padding: 1.5rem 1rem; position: fixed; height: 100vh; z-index: 100;
        }
        #main-content {
            margin-left: var(--sidebar-width);
            flex: 1; display: flex; flex-direction: column; min-width: 0;
        }
        #header {
            height: var(--header-height);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 2rem; background: var(--bg-card); backdrop-filter: blur(8px);
        }

        /* NAVEGAÇÃO SIDEBAR */
        .nav-link {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.75rem 1rem; color: var(--text-muted);
            text-decoration: none; border-radius: var(--radius-md);
            margin-bottom: 0.25rem; transition: var(--transition); cursor: pointer;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--text-main); background: var(--primary-glow);
        }

        /* CONTEÚDO DAS VIEWS */
        .content-body { padding: 2rem; flex: 1; }
        .view-panel { display: none; }
        .view-panel.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CARDS & COMPONENTES */
        .grid-dashboard {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;
        }
        .card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 1.5rem; transition: var(--transition);
        }
        .card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.15); }

        /* BOTÕES & INPUTS */
        .btn {
            background: var(--primary); color: white; border: none;
            padding: 0.6rem 1.2rem; border-radius: var(--radius-md);
            cursor: pointer; font-weight: 600; transition: var(--transition);
            display: inline-flex; align-items: center; gap: 0.5rem;
        }
        .btn:hover { background: var(--primary-hover); }
        .input-field {
            width: 100%; padding: 0.75rem; background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color); border-radius: var(--radius-md);
            color: var(--text-main); margin-bottom: 1rem; outline: none;
        }

        @media (max-width: 768px) {
            #sidebar { width: 70px; padding: 1rem 0.5rem; }
            #sidebar .nav-text { display: none; }
            #main-content { margin-left: 70px; }
        }
    </style>
</head>
<body>

    <!-- AUTH OVERLAY -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2 style="margin-bottom: 1rem;">Portal UEG</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Insira a senha de acesso para continuar</p>
            <input type="password" id="authPass" class="input-field" placeholder="Digite a senha..." />
            <button class="btn" style="width: 100%; justify-content: center;" onclick="v8Authenticate()">Entrar</button>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <div style="font-weight: 800; font-size: 1.25rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 0.5rem;">
            <i data-lucide="graduation-cap"></i> <span class="nav-text">UEG Digital</span>
        </div>
        <nav style="flex: 1;">
            <a class="nav-link active" onclick="v7SetView('v7-dash', this)" aria-label="Acessar Dashboard">
                <i data-lucide="layout-dashboard"></i><span class="nav-text">Dashboard</span>
            </a>
            <a class="nav-link" onclick="v7SetView('v7-disciplinas', this)" aria-label="Acessar Disciplinas">
                <i data-lucide="book-open"></i><span class="nav-text">Disciplinas</span>
            </a>
            <a class="nav-link" onclick="v7SetView('v7-horarios', this)" aria-label="Acessar Horários">
                <i data-lucide="clock"></i><span class="nav-text">Horários</span>
            </a>
            <a class="nav-link" onclick="v7SetView('v7-calendario', this)" aria-label="Acessar Calendário">
                <i data-lucide="calendar"></i><span class="nav-text">Calendário</span>
            </a>
            <a class="nav-link" onclick="v7SetView('v7-foco', this)" aria-label="Acessar Modo Foco">
                <i data-lucide="target"></i><span class="nav-text">Modo Foco</span>
            </a>
        </nav>
    </aside>

    <!-- CONTENT AREA -->
    <div id="main-content">
        <header id="header">
            <h3 id="page-title">Dashboard</h3>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button class="btn" style="background: transparent; border: 1px solid var(--border-color); padding: 0.5rem;" onclick="toggleTheme()" aria-label="Alternar Tema">
                    <i data-lucide="sun-moon"></i>
                </button>
            </div>
        </header>

        <main class="content-body">
            <!-- DASHBOARD VIEW -->
            <section id="v7-dash" class="view-panel active">
                <div class="grid-dashboard">
                    <div class="card">
                        <h4>Progresso Geral</h4>
                        <canvas id="chartProgresso" style="margin-top: 1rem; max-height: 200px;"></canvas>
                    </div>
                    <div class="card">
                        <h4>Avisos Recentes</h4>
                        <p style="color: var(--text-muted); margin-top: 0.5rem;">Nenhum aviso novo no momento.</p>
                    </div>
                </div>
            </section>

            <!-- DISCIPLINAS VIEW -->
            <section id="v7-disciplinas" class="view-panel">
                <div class="card">
                    <h3>Minhas Disciplinas</h3>
                    <p style="color: var(--text-muted); margin-top: 0.5rem;">Lista de matérias do semestre ativo.</p>
                </div>
            </section>

            <!-- HORÁRIOS VIEW -->
            <section id="v7-horarios" class="view-panel">
                <div class="card">
                    <h3>Grade Horária</h3>
                </div>
            </section>

            <!-- CALENDÁRIO VIEW -->
            <section id="v7-calendario" class="view-panel">
                <div class="card">
                    <div id="calendar"></div>
                </div>
            </section>

            <!-- FOCO VIEW -->
            <section id="v7-foco" class="view-panel">
                <div class="card" style="text-align: center; max-width: 400px; margin: 0 auto;">
                    <h3>Timer Pomodoro</h3>
                    <div style="font-size: 3rem; font-family: var(--font-mono); margin: 1.5rem 0;">25:00</div>
                    <button class="btn">Iniciar Sessão</button>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Inicializar Lucide Icons
        lucide.createIcons();

        // Autenticação básica
        function v8Authenticate() {
            const pass = document.getElementById('authPass').value;
            if (pass === 'ueg2026') {
                document.getElementById('auth-overlay').style.display = 'none';
                localStorage.setItem('auth_token', 'granted');
            } else {
                alert('Senha incorreta!');
            }
        }

        // Checar Sessão
        if (localStorage.getItem('auth_token') === 'granted') {
            document.getElementById('auth-overlay').style.display = 'none';
        }

        // Troca de Visões / Abas
        function v7SetView(viewId, el) {
            document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            
            const target = document.getElementById(viewId);
            if (target) {
                target.classList.add('active');
                if (el) el.classList.add('active');
                
                // Atualizar título do cabeçalho
                const text = el ? el.querySelector('.nav-text').innerText : 'Dashboard';
                document.getElementById('page-title').innerText = text;

                // Renderização pontual do Calendário FullCalendar se ativado
                if (viewId === 'v7-calendario' && !window.calendarInitialized) {
                    initCalendar();
                }
            }
        }

        // Alternador de Tema Dark/Light
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
        }

        // Inicialização do Gráfico de Progresso (Chart.js)
        const ctx = document.getElementById('chartProgresso');
        if (ctx) {
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Concluído', 'Pendente'],
                    datasets: [{
                        data: [70, 30],
                        backgroundColor: ['#3B82F6', '#1E293B'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        }

        // Inicialização sob demanda do FullCalendar
        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            if (calendarEl) {
                const calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    locale: 'pt-br',
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth,timeGridWeek'
                    }
                });
                calendar.render();
                window.calendarInitialized = true;
            }
        }
    </script>
</body>
</html>
